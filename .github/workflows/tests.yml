# Runs the overlay's logic tests on every push and pull request.
name: Tests

on:
  push:
  pull_request:

jobs:
  logic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the packages
        run: pip install mss==10.1.0 numpy==2.2.6 opencv-python-headless==4.12.0.88 pillow==11.3.0 pytesseract==0.3.13
      - name: Logic tests
        run: python tests/test_logic.py
